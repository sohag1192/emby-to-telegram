name: 🚀 Auto Release & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.1)'
        required: true
        default: 'v3.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release package for tag: $TAG"

      - name: 📦 Create Clean Release ZIP Archive
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ZIP_NAME="emby-to-telegram-${TAG}.zip"

          # Create staging directory
          mkdir -p staging/emby-to-telegram

          # Copy project files excluding git metadata and local caches
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='venv' \
                    --exclude='.env' \
                    --exclude='selected_script.txt' \
                    --exclude='emby_last_checked.txt' \
                    --exclude='emby_notified.txt' \
                    --exclude='test.py' \
                    ./ staging/emby-to-telegram/

          # Create zip archives
          cd staging
          zip -r "../${ZIP_NAME}" emby-to-telegram/
          cd ..

          # Create a generic named zip for latest download links
          cp "${ZIP_NAME}" emby-to-telegram-latest.zip

          echo "✅ Built archives:"
          ls -lh *.zip

      - name: 🚀 Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            emby-to-telegram-${{ steps.vars.outputs.tag }}.zip
            emby-to-telegram-latest.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
